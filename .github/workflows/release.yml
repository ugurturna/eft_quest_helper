# Push a tag like v0.0.2 -> tests, self-contained publish, zip, GitHub release with the zip attached.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # optional: without this secret the release still ships, just without the scan
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          "ZIP=TarkovQuestTracker-v$version-win-x64.zip" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test -c Release

      # data\ (quests, item list, icons) is copied next to the exe, outside the single file;
      # no .pdb debug symbols in the release zip
      - name: Publish
        run: >
          dotnet publish TarkovQuestTracker/TarkovQuestTracker.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false
          -p:Version=${{ env.VERSION }} -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath $env:ZIP

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true

      - name: VirusTotal key missing
        if: env.VT_API_KEY == ''
        run: echo "::warning::VT_API_KEY repository secret is not set, so the VirusTotal scan was skipped"

      # Scan the exe and the zip; a failed or slow scan never fails the release
      - name: VirusTotal scan
        id: vt
        if: env.VT_API_KEY != ''
        continue-on-error: true
        shell: pwsh
        run: >
          ./.github/scripts/virustotal.ps1 -Version "${{ github.ref_name }}"
          -Files publish/TarkovQuestTracker.exe, $env:ZIP -Out virustotal.json -Notes vt-notes.md

      - name: Add scan to release notes
        if: steps.vt.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          body_path: vt-notes.md
          append_body: true

      # docs/ is the GitHub Pages site; the landing page reads docs/virustotal.json
      - name: Publish scan to landing page
        if: steps.vt.outcome == 'success'
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
          Copy-Item virustotal.json docs/virustotal.json -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/virustotal.json
          git commit -m "VirusTotal scan for ${{ github.ref_name }}"
          git push origin main
